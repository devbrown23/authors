const WHY=[["Misread it","Reread the passage one sentence at a time and restate each in your own words. Most misses start here."],["Didn't predict","Turn Predict first back on. Arriving without an answer is how trap choices win."],["Fell for the trap","Open this type in the Playbook and reread its trap. Then find the single word that makes your choice wrong."],["Rushed","There is no timer here. Slower and right beats faster and wrong every time."],["Didn't know the term","Go to Memory and flip the flashcard for it, then run a Terminology or If-Then round."]];
const CARDS=[
["Premise","A claim offered as support. It answers 'why should I believe that?'","Premises are the 'because' side of the argument."],
["Conclusion","The claim the author wants you to accept. Everything else points at it.","Put 'therefore' in front. If it sounds right, it's the conclusion."],
["Intermediate conclusion","A claim that is supported by a premise and then used to support the main conclusion.","A stepping stone: stood on, and standing on something."],
["Assumption","An unstated claim the argument needs. The gap between the premises and the conclusion.","If it's written in the passage, it isn't an assumption."],
["Sufficient condition","The trigger. If it happens, the other thing is guaranteed.","Sufficient = enough. It sits on the left of the arrow."],
["Necessary condition","The requirement. Without it, the other thing can't happen.","Necessary = needed. It sits on the right of the arrow."],
["Contrapositive","The same if-then, flipped and negated. If A then B becomes if not B then not A.","Flip and negate. Always both, never one."],
["Mistaken reversal","Reading 'if A then B' as 'if B then A'.","Flipped without negating. Rain makes the lawn wet; a wet lawn doesn't prove rain."],
["Mistaken negation","Reading 'if A then B' as 'if not A then not B'.","Negated without flipping. No rain doesn't prove a dry lawn."],
["Some","At least one. Possibly all.","Some is a floor, not a ceiling."],
["Most","More than half. Possibly all.","Most means majority, and all is a majority."],
["Correlation","Two things that show up together. By itself it proves nothing about cause.","Together is not because."],
["Causation","A claim that one thing produces another. The LSAT's favorite thing to attack.","Check ARC: Alternative cause, Reversed cause, Coincidence."],
["Ad hominem","Attacking the person making an argument instead of the argument.","A bad messenger can carry a true message."],
["Circular reasoning","Using the conclusion, reworded, as its own support.","It's true because it's true."],
["Equivocation","A key word quietly changes meaning partway through the argument.","Same word, two jobs."],
["Straw man","Restating an opponent's view as something weaker, then knocking that down.","Fighting a scarecrow instead of the farmer."],
["False dilemma","Treating two options as the only ones when others exist.","Either-or with a missing 'or'."],
["Part to whole","Assuming a group has a quality because each member does, or the reverse.","Great players, not necessarily a great team."],
["Sampling flaw","Generalizing from a group that doesn't represent the population.","Don't survey gym members about exercise."],
["Inference","Something that must be true given the passage. Not a guess, not probably.","If you can't point to the line, you can't pick it."],
["Scope","The exact territory an argument covers. Wrong answers often wander outside it.","Ask: did the author ever talk about this?"],
["Unless","Introduces a requirement. Replace it with 'if not'.","Unless, without, until, except: all mean 'if not'."],
["Only if","Introduces the necessary condition, the right side of the arrow.","'Only' points at what's needed. 'If' alone points at the trigger."]
];
const HOOKS=[
["S before N","Sufficient goes on the left of the arrow, necessary on the right. Think Saturday Night: S, then N."],
["Trigger words","If, when, whenever, any, all, every, each. Whatever follows one of these goes on the left."],
["Requirement words","Only, only if, must, requires, needs, depends on. Whatever follows goes on the right."],
["The 'if not' four","Unless, without, until, except. Swap the word for 'if not' and translate as usual."],
["Flip and negate","The contrapositive is the only safe move with an if-then. Flip both sides, negate both sides, and turn 'and' into 'or'."],
["ARC","Every causal claim can be attacked three ways: Alternative cause, Reversed cause, Coincidence. To weaken, raise one. To strengthen, rule one out."],
["Never climb the ladder","All proves most. Most proves some. You can walk down the ladder. You can never walk up."],
["Kill test","For a necessary assumption, negate the choice. If the argument dies, the choice was necessary."],
["Weak or strong","Necessary assumptions and Must Be True answers like soft words: some, can, at least. Sufficient assumptions like hard ones: all, any, never."],
["Therefore test","Torn between two claims? Say 'A, therefore B' and 'B, therefore A'. The one that sounds right ends in the conclusion."],
["Five-word jobs","After each Reading Comp paragraph, say what it did in five words. 'Old view.' 'Author objects.' 'Proposed fix.'"],
["Who thinks what","In Reading Comp, track each viewpoint and whether the author agrees. Most questions are one of those two things."]
];
function nextCard(){for(let s=1;s<=CARDS.length;s++){const k=(mem.i+s)%CARDS.length;if(!S.known.includes(CARDS[k][0])){mem.i=k;break}}mem.flip=false}
function vMem(){const kn=CARDS.filter(c=>S.known.includes(c[0])).length,all=kn===CARDS.length;
  if(!all&&S.known.includes(CARDS[mem.i][0]))nextCard();const c=CARDS[mem.i];

  ${all?`<div class="card"><h3>Deck cleared</h3><p>You know all ${CARDS.length} terms. Test them under pressure with a Terminology round.</p><div class="row"><button class="primary" data-act="start" data-mode="t:term">Terminology round</button><button data-act="redeck">Go through the deck again</button></div></div>`:
  `<button class="flash" data-act="flip" aria-label="Flip card"><span class="lbl">${mem.flip?"Definition":"Term · tap to flip"}</span><b>${c[0]}</b>${mem.flip?`<span>${c[1]}</span><span class="muted">Hook: ${c[2]}</span>`:""}</button>

   <div class="row"><label class="lbl" for="testdate">Your test date</label><input type="date" id="testdate" value="${S.test}" min="${today()}"><label class="lbl" for="testtime">Start time</label><input type="time" id="testtime" value="${S.time||""}" style="font:inherit;font-family:var(--mono);padding:9px 10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink)"></div>
   <p class="muted">${dl===null?`Enter the date from your LSAC registration and the plan below will put dates on each phase.`:dl<0?"That date has passed. Set a new one to restart the plan.":`<b>${dl} days</b> to go. You are in the <b>${ph[Math.max(cur,0)][0]}</b> phase.`} Check dates and deadlines at <a href="https://www.lsac.org/lsat" target="_blank" rel="noopener">lsac.org</a>.</p></div>
  <div>${ph.map((p,k)=>dl!==null&&dl>=0&&dl<p[1]?"":`<div class="phase ${k===cur&&dl!==null&&dl>=0?"now":""}"><div><h3>${p[0]}</h3><span class="when">${when(p)}${k===cur&&dl!==null&&dl>=0?" · you are here":""}</span></div><p>${p[3]}</p></div>`).join("")}</div>
  <div class="stack"><h2>This week's quests</h2><p class="muted">Resets every Monday. The questions here are original practice. Your timed work should use official LSAT questions from LSAC's LawHub.</p>
   ${QUESTS.map((q,k)=>`<label class="check"><input type="checkbox" id="quest${k}" data-act="quest" data-k="${k}" ${S.quests.done.includes(k)?"checked":""}><span>${q}</span></label>`).join("")}</div>`}

function vProg(){const all=Q.length,w=Q.filter(q=>won(q.id)).length,att=Object.values(S.hist).reduce((a,h)=>a+h.n,0),r=rank(),nx=RANKS[r+1];
  return `<div class="stack"><h2>Progress</h2><p class="muted">${nx?`${nx[0]-S.xp} XP to ${nx[1]}.`:"Top rank reached."} ${syncMsg}.</p></div>
  <div class="strip"><div><span class="lbl">Beaten</span><b>${w}/${all}</b></div><div><span class="lbl">Answers locked</span><b>${att}</b></div><div><span class="lbl">Best run</span><b>${S.best}</b></div><div><span class="lbl">Rematch</span><b>${S.miss.length}</b></div></div>
  <div class="stack"><h3>Mastery by type</h3><p class="muted">A question counts once your latest answer to it is correct.</p>
  <div class="bars">${Object.keys(TYPES).map(t=>{const a=ofType(t),k=a.filter(q=>won(q.id)).length;return `<span>${TYPES[t].n}</span><div class="meter"><i style="width:${k/a.length*100}%"></i></div><span class="n">${k}/${a.length}</span>`}).join("")}</div></div>
  ${whyBlock()}<div class="stack"><h3>Ranks</h3><div class="row">${RANKS.map((x,k)=>`<span class="lbl" style="${k<=r?"color:var(--ink);font-weight:600":""}">${k<=r?"● ":"○ "}${x[1]} ${x[0]}</span>`).join("")}</div></div>
  <div class="row">${ses&&ses.reset?`<span>Erase all XP and history?</span><button data-act="reset2">Yes, erase</button><button data-act="quit">Keep it</button>`:`<button data-act="reset1">Reset progress</button>`}</div>`}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.tagName==="INPUT")return;const a=b.dataset.act;
  if(a==="start"){location.hash="drill";start(b.dataset.mode)}
  else if(a==="show"){ses.shown=true;render()}
  else if(a==="pick"){const d=document.querySelector("details.ruled");if(d)ses.open=d.open;ses.pick=+b.dataset.k;render()}
  else if(a==="lock"){const d=document.querySelector("details.ruled");if(d)ses.open=d.open;lock()}
  else if(a==="next"){if(ses.i+1<ses.list.length){ses.i++;ses.why=null;ses.pick=null;ses.locked=false;ses.shown=!S.predict;ses.open=false;render();window.scrollTo(0,0)}else{ses.done=true;render();window.scrollTo(0,0)}}
  else if(a==="quit"){ses=null;render()}
  else if(a==="why"){const k=+b.dataset.k;if(ses.why!=null)S.why[ses.why]=Math.max(0,(S.why[ses.why]||0)-1);ses.why=k;S.why[k]=(S.why[k]||0)+1;save();render()}
  else if(a==="flip"){mem.flip=!mem.flip;render()}
  else if(a==="knew"){const t=CARDS[mem.i][0];if(!S.known.includes(t))S.known.push(t);save();nextCard();render()}
  else if(a==="again"){nextCard();render()}
  else if(a==="redeck"){S.known=[];mem={i:0,flip:false};save();render()}
  else if(a==="reset1"){ses={reset:true,done:false,list:[]};render()}
  else if(a==="reset2"){const t=S.test,rg=S.reg,tm=S.time;S={reg:rg,time:tm,xp:0,streak:0,best:0,hist:{},miss:[],day:{d:"",n:0},ds:{last:"",n:0},test:t,predict:true,quests:{w:"",done:[]},known:[],why:{},t:0};ses=null;save();render()}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="testdate"){S.test=t.value;save();render()}
  else if(t.id==="testtime"){S.time=t.value;save();render()}
  else if(t.dataset.act==="reg"){S.reg[t.dataset.k]=t.checked;save();render()}
  else if(t.dataset.act==="predict"){S.predict=t.checked;save()}
  else if(t.dataset.act==="quest"){const k=+t.dataset.k;S.quests.done=S.quests.done.filter(x=>x!==k);if(t.checked)S.quests.done.push(k);save()}
});
window.addEventListener("hashchange",()=>{if(ses&&ses.reset)ses=null;render();window.scrollTo(0,0)});
load();render();connect();
</script>

</body>
</html>
