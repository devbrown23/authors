<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recipe Checklist</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2E4A3A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Kitchen index cards on a green cutting board. */
:root{
  --board:#E9E4D6; --card:#FFFDF7; --ink:#21302A; --muted:#5E6B64; --line:#D9D2BF;
  --accent:#2E4A3A; --accent-ink:#F6F1E3; --tomato:#B5432C; --done:#6E7A73; --check:#2E7D4F;
  --serif:"Fraunces",Georgia,serif; --sans:"Work Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --board:#141B17; --card:#1E2722; --ink:#EDE8DA; --muted:#A3ADA6; --line:#34403A;
  --accent:#9CC9AC; --accent-ink:#11201A; --tomato:#F08A72; --done:#7F8A84; --check:#7FD3A0; color-scheme:dark } }
:root[data-theme="dark"]{
  --board:#141B17; --card:#1E2722; --ink:#EDE8DA; --muted:#A3ADA6; --line:#34403A;
  --accent:#9CC9AC; --accent-ink:#11201A; --tomato:#F08A72; --done:#7F8A84; --check:#7FD3A0; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--board);color:var(--ink);font:16px/1.45 var(--sans)}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--accent);color:var(--accent-ink);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
header h1{font:700 22px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
header a{color:inherit;text-decoration:none}
nav{display:flex;gap:4px}
nav a{padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;opacity:.8}
nav a[aria-current]{background:var(--accent-ink);color:var(--accent);opacity:1}
nav .count{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--tomato);color:#fff;font-size:12px;text-align:center}
main.wrap{padding-block:20px calc(60px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h2{font:700 26px/1.15 var(--serif);margin:0;text-wrap:balance}
h3{font:700 18px/1.2 var(--serif);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 0 var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
button,.btn{font:600 15px var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
button:hover,.btn:hover{border-color:var(--ink)}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--tomato)}
button.ghost{background:transparent;border-color:transparent;padding-inline:8px}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
input[type=text],input[type=search],input[type=number],textarea{font:16px var(--sans);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.5}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.field small{font-weight:400;color:var(--muted)}
/* library */
.list{display:flex;flex-direction:column;gap:10px}
.recipe{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-decoration:none;color:inherit}
.recipe:hover{border-color:var(--ink)}
.recipe .meta{font-size:14px;color:var(--muted)}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--board);color:var(--muted);white-space:nowrap}
.pill.go{background:var(--accent);color:var(--accent-ink)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--check);transition:width .3s}
/* checklist */
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks label{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 2px;cursor:pointer}
.checks input{appearance:none;-webkit-appearance:none;width:26px;height:26px;margin:0;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:var(--card)}
.checks input:checked{background:var(--check);border-color:var(--check)}
.checks input:checked::after{content:"";width:7px;height:13px;border:solid var(--card);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.checks input:checked + span{color:var(--done);text-decoration:line-through;text-decoration-color:var(--done)}
.checks .n{font-weight:700;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.checks .qty{font-weight:600}
.checks .from{display:block;font-size:13px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.section-head .muted{font-size:14px;font-variant-numeric:tabular-nums}
.scale{display:flex;align-items:center;gap:6px}
.scale button{min-width:44px;justify-content:center;padding:8px}
.scale output{min-width:84px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:32px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
.done-banner{background:var(--check);color:var(--card);border-radius:14px;padding:14px 18px;font-weight:600}
.scan{display:flex;gap:14px;align-items:center;border-style:dashed;border-width:2px}
.scan .ico{flex:0 0 44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.scan .ico svg{width:24px;height:24px}
.scan div{flex:1;min-width:0}
.scan p{font-size:14px;color:var(--muted)}
.hero{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 56px}
.recipe.has-thumb{grid-template-columns:56px 1fr auto}
.recipe.has-thumb .bar{grid-column:1/-1}
.busy{position:fixed;inset:0;background:rgba(10,16,13,.55);display:grid;place-items:center;padding:16px;z-index:10}
.busy .card{max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.busy img{width:120px;height:120px;object-fit:cover;border-radius:12px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.note{background:var(--board);border-radius:10px;padding:10px 12px;font-size:14px}
@media (max-width:520px){ .scan{flex-wrap:wrap} .scan div{flex:1 1 160px} .scan button{flex:1 1 100%;justify-content:center} }
@media (max-width:420px){ header .wrap{flex-wrap:wrap} h2{font-size:23px} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1><a href="#/">Recipe Checklist</a></h1>
    <nav aria-label="Sections">
      <a href="#/" data-nav="library">Recipes</a>
      <a href="#/shopping" data-nav="shopping">Shopping<span class="count" id="shopCount" hidden></span></a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
const KEY = "recipe-checklist-v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const SAMPLES = [
  { name: "Weeknight Tomato Pasta", servings: 4, tags: "dinner",
    ingredients: ["12 oz spaghetti","3 tbsp olive oil","4 cloves garlic, sliced","1 can (28 oz) whole tomatoes","1/2 tsp red pepper flakes","1 tsp salt","1 handful fresh basil","1/2 cup grated parmesan"],
    steps: ["Bring a large pot of salted water to a boil.","Warm the oil in a wide pan over medium heat and cook the garlic until just golden, about 2 minutes.","Add the pepper flakes and tomatoes, crushing them with a spoon. Simmer 15 minutes.","Cook the spaghetti until 1 minute short of the package time. Save 1 cup of pasta water.","Toss the pasta into the sauce with a splash of pasta water until glossy.","Season with salt, tear in the basil and finish with parmesan."] },
  { name: "Sheet-Pan Granola", servings: 8, tags: "breakfast",
    ingredients: ["3 cups rolled oats","1 cup chopped nuts","1/2 cup pumpkin seeds","1/3 cup maple syrup","1/4 cup neutral oil","1 tsp cinnamon","1/2 tsp salt","3/4 cup dried fruit"],
    steps: ["Heat the oven to 325°F (165°C) and line a sheet pan.","Stir together the oats, nuts, seeds, cinnamon and salt.","Pour in the syrup and oil and mix until everything is coated.","Spread on the pan and press down lightly.","Bake 25 to 30 minutes, rotating once, until deep golden.","Cool completely on the pan, then break up and stir in the dried fruit."] }
];

let S = { recipes: [], shopping: [], t: 0 };
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if (r && Array.isArray(r.recipes)) S = Object.assign(S, r); else seed(); }
  catch(e){ seed(); }
}
function seed(){ S.recipes = SAMPLES.map(r => newRecipe(r)); }
function save(){ S.t = Date.now(); let ok = true; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ ok = false; } updateCount(); return ok; }
function newRecipe(r){
  return { id: uid(), name: r.name, servings: r.servings || 4, scaleTo: r.servings || 4, tags: r.tags || "",
    ingredients: r.ingredients.map(text => ({ text, done: false })),
    steps: r.steps.map(text => ({ text, done: false })), created: Date.now() };
}
const byId = id => S.recipes.find(r => r.id === id);

/* ---------- quantity scaling ---------- */
const UNI = { "¼":.25, "½":.5, "¾":.75, "⅓":1/3, "⅔":2/3, "⅛":.125, "⅜":.375, "⅝":.625, "⅞":.875 };
const QTY = /^\s*((?:\d+\s+)?\d+\/\d+|\d*\.?\d+\s*[¼½¾⅓⅔⅛⅜⅝⅞]?|[¼½¾⅓⅔⅛⅜⅝⅞])(?:\s*(?:-|–|to)\s*((?:\d+\s+)?\d+\/\d+|\d*\.?\d+|[¼½¾⅓⅔⅛⅜⅝⅞]))?/;
function parseNum(s){
  s = s.trim();
  let m;
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if ((m = s.match(/^(\d*\.?\d*)\s*([¼½¾⅓⅔⅛⅜⅝⅞])$/))) return (+m[1] || 0) + UNI[m[2]];
  return parseFloat(s);
}
function fmtNum(n){
  if (n >= 10) return String(Math.round(n));
  const whole = Math.floor(n), frac = n - whole;
  const opts = [[0,""],[1/8,"1/8"],[1/4,"1/4"],[1/3,"1/3"],[3/8,"3/8"],[1/2,"1/2"],[5/8,"5/8"],[2/3,"2/3"],[3/4,"3/4"],[7/8,"7/8"],[1,""]];
  let best = opts[0];
  for (const o of opts) if (Math.abs(frac - o[0]) < Math.abs(frac - best[0])) best = o;
  if (Math.abs(frac - best[0]) > .04) return String(+n.toFixed(2));
  const w = best[0] === 1 ? whole + 1 : whole;
  if (!best[1]) return String(w);
  return w ? w + " " + best[1] : best[1];
}
function splitQty(text, factor){
  const m = text.match(QTY);
  if (!m || /^\s*\d+\s*(?:°|%)/.test(text)) return { qty: "", rest: text };
  const rest = " " + text.slice(m[0].length).trimStart();
  if (factor === 1) return { qty: m[0].trim(), rest };
  const a = parseNum(m[1]); if (!isFinite(a)) return { qty: "", rest: text };
  let q = fmtNum(a * factor);
  if (m[2]) { const b = parseNum(m[2]); if (isFinite(b)) q += "–" + fmtNum(b * factor); }
  return { qty: q, rest };
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const app = document.getElementById("app");
const lines = s => s.split("\n").map(l => l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, "").trim()).filter(Boolean);
function progress(r){ const all = r.ingredients.length + r.steps.length; const d = r.ingredients.filter(i=>i.done).length + r.steps.filter(i=>i.done).length; return { all, d, pct: all ? Math.round(d/all*100) : 0 }; }
let toastTimer;
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }
function updateCount(){ const n = S.shopping.filter(i => !i.done).length; const c = document.getElementById("shopCount"); c.hidden = !n; c.textContent = n; }

/* ---------- views ---------- */
function viewLibrary(){
  const q = (sessionQuery || "").toLowerCase();
  const list = S.recipes.filter(r => !q || (r.name + " " + r.tags + " " + r.ingredients.map(i=>i.text).join(" ")).toLowerCase().includes(q))
    .sort((a,b) => progress(b).d - progress(a).d || a.name.localeCompare(b.name));
  app.innerHTML = `
    <div class="spread"><h2>Your recipes</h2><a class="btn primary" href="#/new">+ New recipe</a></div>
    ${scanCard("recipe", "Recipe from a photo", "Snap a recipe card, cookbook page or handwritten note and Claude types it in for you.")}
    ${S.recipes.length > 3 ? `<input type="search" id="q" placeholder="Search recipes or ingredients" value="${esc(sessionQuery||"")}" aria-label="Search recipes">` : ""}
    <div class="list">${list.map(r => { const p = progress(r); return `
      <a class="card recipe${photoOk(r.photo) ? " has-thumb" : ""}" href="#/r/${r.id}">
        ${photoOk(r.photo) ? `<img class="thumb" src="${r.photo}" alt="">` : ""}
        <div><h3>${esc(r.name)}</h3><div class="meta">${r.ingredients.length} ingredients · ${r.steps.length} steps${r.tags ? " · " + esc(r.tags) : ""}</div></div>
        <span class="pill ${p.d ? "go" : ""}">${p.d ? (p.d === p.all ? "Done" : "In progress") : "Serves " + r.servings}</span>
        ${p.d ? `<div class="bar" aria-hidden="true"><i style="width:${p.pct}%"></i></div>` : ""}
      </a>`; }).join("") || (q ? `<p class="muted">No recipes match “${esc(q)}”.</p>` : `
      <div class="card empty"><h3>No recipes yet</h3><p class="muted">Paste in a recipe and check things off as you cook.</p><a class="btn primary" href="#/new">Add your first recipe</a></div>`)}
    </div>
    <div class="row muted" style="font-size:14px;margin-top:8px">
      <button class="ghost" id="exp">Export backup</button>
      <button class="ghost" id="imp">Import backup</button>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
    </div>`;
  const qi = document.getElementById("q");
  if (qi) qi.addEventListener("input", () => { sessionQuery = qi.value; const pos = qi.selectionStart; viewLibrary(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); });
  wireScan();
  document.getElementById("exp").onclick = exportData;
  document.getElementById("imp").onclick = () => document.getElementById("impFile").click();
  document.getElementById("impFile").onchange = importData;
}
let sessionQuery = "";

function viewRecipe(id){
  const r = byId(id); if (!r) return notFound();
  const factor = r.scaleTo / r.servings;
  const p = progress(r);
  const ingDone = r.ingredients.filter(i=>i.done).length, stDone = r.steps.filter(i=>i.done).length;
  app.innerHTML = `
    <div class="spread"><a class="btn ghost" href="#/">← Recipes</a><a class="btn" href="#/edit/${r.id}">Edit</a></div>
    ${photoOk(r.photo) ? `<img class="hero" src="${r.photo}" alt="Photo for ${esc(r.name)}">` : ""}
    <div><h2>${esc(r.name)}</h2>${r.tags ? `<p class="muted">${esc(r.tags)}</p>` : ""}</div>
    ${p.all && p.d === p.all ? `<div class="done-banner">All done. Enjoy! <button class="ghost" style="color:inherit;text-decoration:underline" data-act="reset">Start fresh</button></div>` : ""}
    <div class="card spread">
      <div class="scale" role="group" aria-label="Servings">
        <button data-act="less" aria-label="Fewer servings" ${r.scaleTo <= 1 ? "disabled" : ""}>−</button>
        <output>${r.scaleTo} serving${r.scaleTo === 1 ? "" : "s"}</output>
        <button data-act="more" aria-label="More servings">+</button>
      </div>
      ${factor !== 1 ? `<button class="ghost" data-act="orig">Reset to ${r.servings}</button>` : ""}
    </div>
    <section class="card">
      <div class="section-head"><h3>Ingredients</h3><span class="muted">${ingDone} of ${r.ingredients.length} gathered</span></div>
      <ul class="checks">${r.ingredients.map((it, i) => { const s = splitQty(it.text, factor); return `
        <li><label><input type="checkbox" data-list="ingredients" data-i="${i}" ${it.done ? "checked" : ""}><span>${s.qty ? `<span class="qty">${esc(s.qty)}</span>` : ""}${esc(s.rest)}</span></label></li>`; }).join("")}</ul>
      <div class="row" style="margin-top:10px">
        <button data-act="shop" ${ingDone === r.ingredients.length ? "disabled" : ""}>Add ${ingDone ? "unchecked" : "all"} to shopping list</button>
      </div>
    </section>
    <section class="card">
      <div class="section-head"><h3>Steps</h3><span class="muted">${stDone} of ${r.steps.length} done</span></div>
      <ul class="checks">${r.steps.map((it, i) => `
        <li><label><input type="checkbox" data-list="steps" data-i="${i}" ${it.done ? "checked" : ""}><span><span class="n">${i+1}.</span>${esc(it.text)}</span></label></li>`).join("")}</ul>
    </section>
    <div class="row">
      <button data-act="reset" ${p.d ? "" : "disabled"}>Uncheck everything</button>
    </div>`;
  app.onchange = e => {
    const c = e.target; if (!c.dataset.list) return;
    r[c.dataset.list][+c.dataset.i].done = c.checked; save();
    const y = scrollY; viewRecipe(id); scrollTo(0, y);
  };
  app.onclick = e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "less") r.scaleTo = Math.max(1, r.scaleTo - 1);
    if (a === "more") r.scaleTo = Math.min(99, r.scaleTo + 1);
    if (a === "orig") r.scaleTo = r.servings;
    if (a === "reset") { r.ingredients.forEach(i => i.done = false); r.steps.forEach(i => i.done = false); toast("Checklist cleared"); }
    if (a === "shop") {
      const have = new Set(S.shopping.filter(s => !s.done).map(s => s.text.toLowerCase()));
      let n = 0;
      r.ingredients.filter(i => !i.done).forEach(i => { const s = splitQty(i.text, factor); const text = (s.qty ? s.qty + s.rest : s.rest).trim();
        if (!have.has(text.toLowerCase())) { S.shopping.push({ id: uid(), text, from: r.name, done: false }); n++; } });
      toast(n ? `Added ${n} item${n === 1 ? "" : "s"} to shopping list` : "Already on your shopping list");
    }
    save(); const y = scrollY; viewRecipe(id); scrollTo(0, y);
  };
}

function viewEdit(id){
  const found = id ? byId(id) : null; if (id && !found) return notFound();
  const draft = !id && pendingDraft ? pendingDraft : null; pendingDraft = null;
  const r = found;
  const v = found || draft;           // values that prefill the form
  let photo = v && photoOk(v.photo) ? v.photo : "";
  app.innerHTML = `
    <div class="spread"><a class="btn ghost" href="${r ? "#/r/" + r.id : "#/"}">← Cancel</a></div>
    <h2>${r ? "Edit recipe" : draft ? "Check the recipe" : "New recipe"}</h2>
    ${draft ? `<p class="note">Claude read this from your photo. Look it over, fix anything it got wrong, then tap <b>Save recipe</b>.${draft.note ? " " + esc(draft.note) : ""}</p>` : ""}
    <div id="photoBox"></div>
    <form class="card" id="f" style="display:flex;flex-direction:column;gap:14px">
      <label class="field">Name<input type="text" name="name" required maxlength="120" value="${v ? esc(v.name) : ""}" placeholder="e.g. Grandma's lemon cake"></label>
      <div class="row" style="gap:14px">
        <label class="field" style="flex:0 0 120px">Servings<input type="number" name="servings" min="1" max="99" value="${v ? v.servings : 4}" required></label>
        <label class="field" style="flex:1 1 200px">Tags <small>optional</small><input type="text" name="tags" maxlength="80" value="${v ? esc(v.tags) : ""}" placeholder="dinner, vegetarian"></label>
      </div>
      <label class="field">Ingredients <small>One per line. Start with the amount (2 cups, 1/2 tsp) so it scales.</small>
        <textarea name="ingredients" required placeholder="2 cups flour&#10;1 tsp baking soda&#10;3 eggs">${v ? esc(v.ingredients.map(i=>i.text).join("\n")) : ""}</textarea></label>
      <label class="field">Steps <small>One per line. Numbers and bullets are removed for you.</small>
        <textarea name="steps" required placeholder="Heat the oven to 350°F.&#10;Whisk the dry ingredients.">${v ? esc(v.steps.map(i=>i.text).join("\n")) : ""}</textarea></label>
      <div class="spread">
        <button class="primary" type="submit">${r ? "Save changes" : "Save recipe"}</button>
        ${r ? `<button type="button" class="danger" id="del">Delete recipe</button>` : ""}
      </div>
    </form>`;
  app.onchange = null; app.onclick = null;
  const box = document.getElementById("photoBox");
  const drawPhoto = () => {
    box.innerHTML = photo
      ? `<div class="card stack" style="display:flex;flex-direction:column;gap:10px"><img class="hero" src="${photo}" alt="Recipe photo"><div class="row"><button type="button" id="phChange">Change photo</button><button type="button" class="danger" id="phDel">Remove photo</button></div></div>`
      : `<div class="row"><button type="button" id="phChange">+ Add a photo</button></div>`;
    box.insertAdjacentHTML("beforeend", `<input type="file" id="phFile" accept="image/*" hidden>`);
    document.getElementById("phChange").onclick = () => document.getElementById("phFile").click();
    const d = document.getElementById("phDel"); if (d) d.onclick = () => { photo = ""; drawPhoto(); };
    document.getElementById("phFile").onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      const p = await shrink(file); if (p) { photo = p; drawPhoto(); } else toast("Couldn't open that photo");
    };
  };
  drawPhoto();
  const f = document.getElementById("f");
  f.onsubmit = e => {
    e.preventDefault();
    const d = new FormData(f), ing = lines(d.get("ingredients")), st = lines(d.get("steps"));
    if (!ing.length || !st.length) return toast("Add at least one ingredient and one step");
    const servings = Math.max(1, Math.min(99, parseInt(d.get("servings"), 10) || 1));
    const keep = (old, list) => list.map(text => ({ text, done: !!(old.find(o => o.text === text) || {}).done }));
    if (r) {
      Object.assign(r, { name: d.get("name").trim(), tags: d.get("tags").trim(),
        ingredients: keep(r.ingredients, ing), steps: keep(r.steps, st) });
      if (r.servings !== servings) { r.servings = servings; r.scaleTo = servings; }
      setPhoto(r, photo); location.hash = "#/r/" + r.id;
    } else {
      const n = newRecipe({ name: d.get("name").trim(), servings, tags: d.get("tags").trim(), ingredients: ing, steps: st });
      S.recipes.push(n); setPhoto(n, photo, "Recipe added"); location.hash = "#/r/" + n.id;
    }
  };
  const del = document.getElementById("del");
  if (del) del.onclick = () => { if (confirm(`Delete “${r.name}”? This can't be undone.`)) { S.recipes = S.recipes.filter(x => x.id !== r.id); save(); location.hash = "#/"; toast("Recipe deleted"); } };
}

function viewShopping(){
  const open = S.shopping.filter(i => !i.done), got = S.shopping.filter(i => i.done);
  const item = it => `<li><label><input type="checkbox" data-id="${it.id}" ${it.done ? "checked" : ""}><span>${esc(it.text)}${it.from ? `<span class="from">${esc(it.from)}</span>` : ""}</span></label></li>`;
  app.innerHTML = `
    <h2>Shopping list</h2>
    ${scanCard("shopping", "List from a photo", "Snap a handwritten list or a recipe and Claude adds the items here.")}
    <form class="row" id="add" style="flex-wrap:nowrap">
      <input type="text" name="t" placeholder="Add an item" aria-label="Add an item" maxlength="160" style="flex:1">
      <button class="primary" type="submit">Add</button>
    </form>
    ${S.shopping.length ? `
      <section class="card">
        <div class="section-head"><h3>To buy</h3><span class="muted">${open.length} item${open.length === 1 ? "" : "s"}</span></div>
        ${open.length ? `<ul class="checks">${open.map(item).join("")}</ul>` : `<p class="muted">Everything's in the cart.</p>`}
      </section>
      ${got.length ? `<section class="card">
        <div class="section-head"><h3>In the cart</h3><button class="ghost" id="clr">Clear ${got.length}</button></div>
        <ul class="checks">${got.map(item).join("")}</ul></section>` : ""}
      <div class="row"><button class="danger" id="clrAll">Clear whole list</button></div>`
    : `<div class="card empty"><h3>Nothing to buy</h3><p class="muted">Open a recipe and tap “Add to shopping list”, or type an item above.</p></div>`}`;
  app.onclick = null;
  wireScan();
  app.onchange = e => { const c = e.target; if (!c.dataset.id) return; const it = S.shopping.find(s => s.id === c.dataset.id); if (it) { it.done = c.checked; save(); viewShopping(); } };
  document.getElementById("add").onsubmit = e => { e.preventDefault(); const v = e.target.t.value.trim(); if (!v) return; S.shopping.unshift({ id: uid(), text: v, from: "", done: false }); save(); viewShopping(); document.querySelector('#add input').focus(); };
  const clr = document.getElementById("clr"); if (clr) clr.onclick = () => { S.shopping = S.shopping.filter(i => !i.done); save(); viewShopping(); };
  const all = document.getElementById("clrAll"); if (all) all.onclick = () => { if (confirm("Clear the whole shopping list?")) { S.shopping = []; save(); viewShopping(); } };
}

function notFound(){ app.innerHTML = `<div class="card empty"><h3>Recipe not found</h3><a class="btn primary" href="#/">Back to recipes</a></div>`; app.onchange = app.onclick = null; }

/* ---------- photos ---------- */
const photoOk = p => typeof p === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p);
// Shrinks a picked photo to a small JPEG so many fit in the phone's storage.
async function shrink(file, max = 900){
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    return c.toDataURL("image/jpeg", .72);
  }catch(e){ return ""; }
}
function setPhoto(r, photo, okMsg = "Saved"){
  if (photo) r.photo = photo; else delete r.photo;
  if (save()) return toast(okMsg);
  delete r.photo; save(); toast("Saved, but your phone's storage is full so the photo wasn't kept");
}

/* ---------- Claude reads photos ---------- */
let sampleApi = null, imgMax = 1, downloadsApi = null;
(async () => {
  if (!window.claude || typeof claude.use !== "function") return;
  try{
    const s = await claude.use("sample");
    const lim = s ? await s.limits().catch(() => null) : null;
    if (lim && lim.images) { sampleApi = s; imgMax = Math.max(1, lim.images.maxCount || 1); document.querySelectorAll(".scan").forEach(el => el.hidden = false); }
  }catch(e){}
})();
(async () => { try{ if (window.claude && claude.use) downloadsApi = await claude.use("downloads"); }catch(e){} })();

const CAM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
function scanCard(mode, title, text){
  return `<div class="card scan" data-mode="${mode}" ${sampleApi ? "" : "hidden"}>
    <span class="ico">${CAM}</span><div><h3>${title}</h3><p>${text}</p></div>
    <button class="primary" data-scan>Choose photo</button>
    <input type="file" accept="image/*" multiple hidden data-scanfile></div>`;
}
function wireScan(){
  const card = app.querySelector(".scan"); if (!card) return;
  const input = card.querySelector("[data-scanfile]");
  card.querySelector("[data-scan]").onclick = () => input.click();
  input.onchange = () => { const files = [...input.files].slice(0, imgMax); input.value = ""; if (files.length) scanPhotos(files, card.dataset.mode); };
}

const PROMPTS = {
  recipe: `The attached photo(s) show a recipe: a cookbook page, recipe card, handwritten note or a screenshot. Several photos are pages of the same recipe.
Read it and reply with only this JSON:
{"name": string, "servings": number, "tags": string, "ingredients": [string], "steps": [string], "note": string}
- ingredients: one per entry, amount and unit first exactly as written ("2 cups flour", "1/2 tsp salt"). Keep any section names out.
- steps: one instruction per entry, without numbers or bullets.
- servings: as stated; if not stated, your best estimate.
- tags: 1 to 3 short lowercase words, comma separated (for example "dinner, bbq").
- note: empty, or one short sentence about anything you could not read or had to guess.
If the photo shows a finished dish with no written recipe, write a sensible home recipe for that dish and say so in note.
If there is no food or recipe at all, reply {"error": "one short sentence saying what the photo shows"}.`,
  shopping: `The attached photo(s) show a shopping list (handwritten or printed), a recipe, or food items.
Reply with only this JSON: {"items": [string]}
- A list: copy each item, one per entry, fixing obvious spelling.
- A recipe: list its ingredients as things to buy, amount first ("2 lb brisket").
- Food or an empty fridge/pantry: list the groceries shown that would need restocking.
If nothing in the photo can become a shopping list, reply {"items": [], "error": "one short sentence saying what the photo shows"}.`
};
const SCAN_ERR = { not_granted: "Claude wasn't allowed to read photos on this page.", sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "Too many photos at once. Wait a minute and try again.", image_rejected: "That photo didn't work. Try a JPG or PNG.",
  refused: "Claude couldn't read that photo. Try another one.", invalid_json: "Claude couldn't make sense of that photo. Try a clearer, closer shot.",
  empty_completion: "Claude couldn't make sense of that photo. Try a clearer, closer shot.", session_expired: "Sign in to Claude again, then retry." };

async function scanPhotos(files, mode){
  if (!sampleApi) return;
  const ctl = new AbortController();
  const preview = await shrink(files[0], 300);
  const ov = document.createElement("div"); ov.className = "busy";
  ov.innerHTML = `<div class="card" role="status" aria-live="polite">${photoOk(preview) ? `<img src="${preview}" alt="">` : ""}<div class="spin" aria-hidden="true"></div>
    <h3>Reading your photo…</h3><p class="muted" style="font-size:14px">This usually takes 10 to 30 seconds.</p><button type="button">Stop</button></div>`;
  ov.querySelector("button").onclick = () => ctl.abort();
  document.body.appendChild(ov);
  try{
    const out = await sampleApi.json(PROMPTS[mode], { images: files, signal: ctl.signal });
    if (!out || typeof out !== "object") throw { code: "invalid_json" };
    if (out.error && !(out.items && out.items.length) && !(out.ingredients && out.ingredients.length)) { toast(String(out.error).slice(0, 140)); return; }
    const strs = a => Array.isArray(a) ? a.map(x => String(x).trim()).filter(Boolean).slice(0, 80) : [];
    if (mode === "recipe") {
      const ing = strs(out.ingredients), st = strs(out.steps);
      if (!ing.length && !st.length) throw { code: "invalid_json" };
      pendingDraft = { name: String(out.name || "Untitled recipe").slice(0, 120), servings: Math.max(1, Math.min(99, parseInt(out.servings, 10) || 4)),
        tags: String(out.tags || "").slice(0, 80), ingredients: ing.map(text => ({ text })), steps: st.map(text => ({ text })),
        note: String(out.note || "").slice(0, 240), photo: await shrink(files[0]) };
      if (location.hash === "#/new") route(); else location.hash = "#/new";
    } else {
      const items = strs(out.items);
      if (!items.length) throw { code: "invalid_json" };
      const have = new Set(S.shopping.filter(s => !s.done).map(s => s.text.toLowerCase()));
      const fresh = items.filter(t => !have.has(t.toLowerCase()));
      S.shopping.unshift(...fresh.map(text => ({ id: uid(), text, from: "From your photo", done: false })));
      save(); viewShopping();
      toast(fresh.length ? `Added ${fresh.length} item${fresh.length === 1 ? "" : "s"} from your photo` : "Those items are already on your list");
    }
  }catch(e){
    const code = e && e.code;
    if (code === "not_granted" || code === "sampling_disabled") { sampleApi = null; document.querySelectorAll(".scan").forEach(el => el.hidden = true); }
    if (code !== "cancelled") toast(SCAN_ERR[code] || "Something went wrong reading the photo. Try again.");
  }finally{ ov.remove(); }
}
let pendingDraft = null;

/* ---------- backup ---------- */
function exportData(){
  const json = JSON.stringify({ app: "recipe-checklist", version: 1, recipes: S.recipes, shopping: S.shopping }, null, 2);
  if (downloadsApi) {
    downloadsApi.save({ filename: "recipes-backup.json", data: json }).catch(e => { if (e && e.code !== "declined") toast("Couldn't save the backup here"); });
    return;
  }
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "recipes-backup.json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(e){
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if (!Array.isArray(d.recipes)) throw 0;
      const clean = d.recipes.filter(r => r && r.name && Array.isArray(r.ingredients) && Array.isArray(r.steps)).map(r => ({
        id: uid(), name: String(r.name).slice(0,120), servings: +r.servings || 4, scaleTo: +r.servings || 4, tags: String(r.tags || "").slice(0,80),
        ingredients: r.ingredients.map(i => ({ text: String(i.text ?? i), done: false })),
        steps: r.steps.map(i => ({ text: String(i.text ?? i), done: false })), created: Date.now() }));
      const names = new Set(S.recipes.map(r => r.name.toLowerCase()));
      const added = clean.filter(r => !names.has(r.name.toLowerCase()));
      S.recipes.push(...added); save(); route(); toast(`Imported ${added.length} recipe${added.length === 1 ? "" : "s"}`);
    }catch(err){ toast("That file isn't a recipe backup"); }
  };
  rd.readAsText(file);
}

/* ---------- router ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const [view, id] = h.split("/");
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", (view === "shopping") === (a.dataset.nav === "shopping")));
  if (view === "r") viewRecipe(id);
  else if (view === "new") viewEdit();
  else if (view === "edit") viewEdit(id);
  else if (view === "shopping") viewShopping();
  else viewLibrary();
}
let lastView = "";
addEventListener("hashchange", () => { route(); const v = location.hash.split("/")[1] || ""; if (v !== lastView) scrollTo(0,0); lastView = v; });
addEventListener("storage", e => { if (e.key === KEY) { load(); route(); updateCount(); } });
load(); updateCount(); route();
</script>
